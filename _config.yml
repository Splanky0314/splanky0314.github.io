title: Daeun World
email: splanky0314@gmail.com
author: Daeun
copyright: "Daeunworld (cleft) 2017-{currentYear} {author}"

description: >-
  Programming과 각종 IT 이슈와 제품 정보를 전문적으로 다루는 웹 블로그입니다. 😄 / Problem Solving, Web, IT Technology

url: "https://daeunworld.xyz"
baseurl: ""
favicon: "https://cdn.jsdelivr.net/gh/splanky0314/CDN/DEFAULT/favicon.ico"

lang: ko
timezone: Asia/Seoul

yat:
  date_format: "%b %d, %Y"

debug: false
header_transparent: true
night_mode: "on"

google_analytics: [G-RPE3V2E3C1]
sitemap: true
paginate: 10
paginate_path: "/page:num/"

markdown: kramdown
kramdown:
  input: GFM

# The copied YAT theme still uses Sass imports to share dynamically configured
# variables. Other deprecated Sass APIs have been migrated; suppress only the
# import warning until the theme is converted to modules as a whole.
sass:
  silence_deprecations:
    - import

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-spaceship

# 저장소 관리용 파일이 빌드 결과물에 복사되지 않도록 제외
exclude:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - LICENSE.txt
  - todo.md
  - tasks/
  - scripts/
  - push.sh
  - push.log

# _posts/hidden 아래 글은 게시하지 않음 (비공개 보관용)
defaults:
  - scope:
      path: "_posts/hidden"
    values:
      published: false
