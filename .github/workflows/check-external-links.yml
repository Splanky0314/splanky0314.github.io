name: External link report

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check external links
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: >-
            --no-progress
            --exclude-mail
            --max-retries 2
            --timeout 20
            --output lychee-report.md
            './**/*.md'
            './**/*.html'
            './_config.yml'
          fail: true

      - name: Add report to workflow summary
        if: always()
        run: |
          if [[ -s lychee-report.md ]]; then
            cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No broken external links found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: lychee-report.md
          if-no-files-found: ignore
