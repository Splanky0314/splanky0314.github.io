{% if include.translate_langs %}
  {% assign translate_langs = include.translate_langs %}
{% endif %}

{% if include.lang %}
  {% assign lang = include.lang %}
{% endif %}

<div id="google_translate_element" style="display: none;">
</div>

<span class="ct-language">
  <ul class="list-unstyled ct-language-dropdown">
    {% for item in translate_langs %}
      <li>
        <a href="#" class="lang-select" data-lang="{{ item.lang }}">
          {% if item.img %}
          <img src="{{ item.img }}" title="{{ item.text }}">
          {% else %}
            {{ item.text }}
          {% endif %}
        </a>
      </li>
    {% endfor %}
  </ul>
</span>

<script type="text/javascript">
(function() {
  var langSelect = document.querySelector('.ct-language');
  var translateScriptLoaded = false;
  var pendingLang = null;
  var applyTimer = null;

  function triggerHtmlEvent(element, eventName) {
    var event;
    if (document.createEvent) {
      event = document.createEvent('HTMLEvents');
      event.initEvent(eventName, true, true);
      element.dispatchEvent(event);
    } else {
      event = document.createEventObject();
      event.eventType = eventName;
      element.fireEvent('on' + event.eventType, event);
    }
  }

  function markSelected(target) {
    var selected = document.querySelector('.ct-language .ct-language-selected');
    if (selected) {
      selected.classList.remove('ct-language-selected');
    }
    target.parentElement.classList.add('ct-language-selected');
  }

  function translationApplied(lang) {
    return document.cookie.indexOf('googtrans=/{{ lang }}/' + lang) !== -1;
  }

  // Google builds the .goog-te-combo select (and binds its change handler)
  // asynchronously after googleTranslateElementInit fires, so a single apply
  // attempt can be silently dropped. Keep retrying until the cookie confirms
  // the translation took effect.
  function startApplyLoop() {
    if (applyTimer) {
      return;
    }
    var attempts = 0;
    applyTimer = setInterval(function() {
      attempts += 1;
      if (!pendingLang || attempts > 50) {
        clearInterval(applyTimer);
        applyTimer = null;
        return;
      }

      var googleCombo = document.querySelector('select.goog-te-combo');
      if (!googleCombo || googleCombo.options.length === 0) {
        return;
      }

      if (googleCombo.value === pendingLang && translationApplied(pendingLang)) {
        pendingLang = null;
        clearInterval(applyTimer);
        applyTimer = null;
        return;
      }

      googleCombo.value = pendingLang;
      triggerHtmlEvent(googleCombo, 'change');
    }, 300);
  }

  function loadTranslateScript() {
    if (translateScriptLoaded) {
      return;
    }
    translateScriptLoaded = true;
    var script = document.createElement('script');
    script.type = 'text/javascript';
    script.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
    script.async = true;
    document.head.appendChild(script);
  }

  window.googleTranslateElementInit = function() {
    new google.translate.TranslateElement({
      pageLanguage: '{{ lang }}',
      autoDisplay: false,
      layout: google.translate.TranslateElement.InlineLayout.VERTICAL
    }, 'google_translate_element');

    // Links to cross-origin destinations are unsafe
    var gll = document.getElementsByClassName('goog-logo-link')[0];
    if (gll) {
      gll.setAttribute('rel', 'noopener');
    }
  };

  if (!langSelect) {
    return;
  }

  langSelect.addEventListener('click', function(event) {
    if (!event.target) {
      return;
    }

    var target = event.target;
    while (target && target !== langSelect) {
      if (target.matches('.lang-select')) {
        break;
      }
      target = target.parentElement;
    }

    if (target && target.matches('.lang-select')) {
      pendingLang = target.getAttribute('data-lang');
      markSelected(target);
      loadTranslateScript();
      startApplyLoop();
      event.preventDefault();
    }
  });
})();
</script>
